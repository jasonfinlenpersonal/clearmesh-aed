name: clearmesh-defib

services:

  db:
    image: postgis/postgis:17-3.6-alpine
    container_name: defib-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: defib
      POSTGRES_USER: defib
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ${DEFIB_DATA_DIR:?Set DEFIB_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defib -d defib"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Internal network only: no published port.
    networks:
      - defib


  app:
    build: .
    image: clearmesh-defib:latest
    # clearmesh-edge nginx proxies aed.clearmesh.app to this name on clearmesh-edge-net.
    container_name: clearmesh-defib
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://defib:${POSTGRES_PASSWORD}@db:5432/defib
      AUTH_URL: ${AUTH_URL:-https://aed.clearmesh.app}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      # Admin sign-in fails (the rest of the site works) until these are set.
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS}
      IP_HASH_SALT: ${IP_HASH_SALT:?Set IP_HASH_SALT}
      # Optional services: each feature switches off cleanly when its key is blank.
      W3W_API_KEY: ${W3W_API_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}
      SUBMISSIONS_PER_HOUR: ${SUBMISSIONS_PER_HOUR:-5}
      SUBMISSIONS_PER_DAY: ${SUBMISSIONS_PER_DAY:-20}
      REPORTS_PER_HOUR: ${REPORTS_PER_HOUR:-10}

    volumes:
      # Must be writable by uid 1001 (see README).
      - ${DEFIB_DATA_DIR}/uploads:/data/uploads

    networks:
      - defib
      - edge


networks:
  defib:
    # No route out: only the app talks to Postgres.
    internal: true
  edge:
    external: true
    name: clearmesh-edge-net
