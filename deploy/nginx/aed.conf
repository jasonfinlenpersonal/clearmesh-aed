# AED Finder Australia (aed.clearmesh.app)
#
# Cloudflare (TLS) -> cloudflared tunnel -> clearmesh-edge-nginx:80 ->
# clearmesh-defib:3000, all on the Docker network clearmesh-edge-net.
#
# Copy to clearmesh-edge/nginx/conf.d/aed.conf and mount it in the edge
# docker-compose.yml like the other sites.
#
# Public site, no Cloudflare Access: anyone can view and submit. /admin is
# protected by Google sign-in inside the app. The app does its own rate
# limiting, keyed on the X-Real-IP set below.

# Traffic arrives through the Cloudflare tunnel, so $remote_addr is the
# cloudflared container. Cloudflare passes the visitor's address in
# CF-Connecting-IP; fall back to $remote_addr for requests inside the network.
map $http_cf_connecting_ip $aed_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name aed.clearmesh.app;

    # Resolve the container per request through Docker's DNS (cached 10 s), so
    # nginx starts even while the AED stack is down or being rebuilt.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $aed_app http://clearmesh-defib:3000;

    # Photo uploads: the browser shrinks big photos, the app caps them at 10 MB.
    client_max_body_size 12M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $aed_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass $aed_app;
    }
}
